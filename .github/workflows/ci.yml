name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lexicons-lint:
    runs-on: ubuntu-latest
    env:
      GOAT_VERSION: '0.2.7'
      GOAT_SHA256: '691edc92ea497e675b8d2c7c7272e9e938abf02c32d800d091adade07983896d'
    steps:
      - uses: actions/checkout@v4
      # Pinned, checksummed release binary of https://github.com/bluesky-social/goat.
      # To bump it, update both values from the release's checksums.txt.
      - name: Install goat
        run: |
          curl -fsSL -o goat.tar.gz "https://github.com/bluesky-social/goat/releases/download/v${GOAT_VERSION}/goat_Linux_x86_64.tar.gz"
          echo "${GOAT_SHA256}  goat.tar.gz" | sha256sum -c -
          tar -xzf goat.tar.gz -C "$RUNNER_TEMP" goat
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Warnings fail the job too (goat exits non-zero on any lint).
      - name: Lint lexicon schemas
        run: goat lex lint lexicons/
